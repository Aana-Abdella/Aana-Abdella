<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Aana Abdella — Software Engineer</title>
  <desc id="description">Animated midnight-violet banner for Aana Abdella's GitHub profile.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset="0.52" stop-color="#111A36"/>
      <stop offset="1" stop-color="#0A1228"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="0 0;120 0;0 0"
        dur="10s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <linearGradient id="orbOne" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbTwo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.09"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <circle cx="170" cy="45" r="145" fill="url(#orbOne)" filter="url(#blur)">
    <animate attributeName="cx" values="170;240;170" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="45;75;45" dur="9s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1030" cy="245" r="170" fill="url(#orbTwo)" filter="url(#blur)">
    <animate attributeName="cx" values="1030;965;1030" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="245;205;245" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.72">
    <path d="M805 73L1006 73" stroke="#22D3EE" stroke-opacity="0.32"/>
    <path d="M905 23V223" stroke="#22D3EE" stroke-opacity="0.22"/>
    <circle cx="905" cy="73" r="6" fill="#22D3EE">
      <animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1006" cy="73" r="4" fill="#A78BFA"/>
    <circle cx="905" cy="223" r="4" fill="#A78BFA"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="89" width="72" height="72" rx="18" fill="#111C3A" stroke="#7C3AED" stroke-opacity="0.7"/>
    <path d="M93 112H103L108 101L113 112H123L115 119L118 130L108 124L98 130L101 119L93 112Z" fill="#22D3EE"/>
  </g>

  <text x="170" y="123" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-1">
    Aana Abdella
  </text>

  <text x="172" y="160" fill="#C4B5FD" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2">
    SOFTWARE ENGINEER
  </text>

  <text x="172" y="202" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18">
    Full-stack systems · Web3 intelligence · Continuous learning
  </text>

  <rect x="172" y="229" width="120" height="30" rx="15" fill="#7C3AED" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.65"/>
  <text x="194" y="249" fill="#DDD6FE" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">
    BUILD · LEARN
  </text>

  <rect x="303" y="229" width="92" height="30" rx="15" fill="#22D3EE" fill-opacity="0.10" stroke="#67E8F9" stroke-opacity="0.55"/>
  <text x="323" y="249" fill="#CFFAFE" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">
    IMPROVE
  </text>
</svg>
